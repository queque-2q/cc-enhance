<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 500" width="200" height="500">
  <!-- 竹节主体 - 上段 -->
  <rect x="75" y="20" width="50" height="150" rx="6" fill="#4CAF50"/>
  
  <!-- 竹节主体 - 中段 -->
  <rect x="75" y="190" width="50" height="150" rx="6" fill="#66BB6A"/>
  
  <!-- 竹节主体 - 下段 -->
  <rect x="75" y="360" width="50" height="120" rx="6" fill="#43A047"/>
  
  <!-- 节 1 - 上段与中段之间 -->
  <rect x="68" y="175" width="64" height="12" rx="4" fill="#2E7D32"/>
  <path d="M 68 181 Q 100 171 132 181" stroke="#1B5E20" stroke-width="2" fill="none"/>
  
  <!-- 节 2 - 中段与下段之间 -->
  <rect x="68" y="345" width="64" height="12" rx="4" fill="#2E7D32"/>
  <path d="M 68 351 Q 100 341 132 351" stroke="#1B5E20" stroke-width="2" fill="none"/>
  
  <!-- 竹节底部 -->
  <rect x="68" y="480" width="64" height="12" rx="4" fill="#2E7D32"/>
  
  <!-- 竹节高光线 - 左侧 -->
  <rect x="80" y="25" width="6" height="140" rx="3" fill="#81C784" opacity="0.5"/>
  <rect x="80" y="195" width="6" height="140" rx="3" fill="#81C784" opacity="0.5"/>
  <rect x="80" y="365" width="6" height="110" rx="3" fill="#81C784" opacity="0.5"/>
  
  <!-- 竹叶 - 左1 -->
  <path d="M 75 60 Q 20 30 10 80 Q 30 70 75 70" fill="#388E3C"/>
  
  <!-- 竹叶 - 右1 -->
  <path d="M 125 100 Q 180 70 190 120 Q 170 110 125 110" fill="#388E3C"/>
  
  <!-- 竹叶 - 左2 -->
  <path d="M 75 220 Q 15 190 5 240 Q 25 230 75 230" fill="#388E3C"/>
  
  <!-- 竹叶 - 右2 -->
  <path d="M 125 270 Q 185 240 195 290 Q 175 280 125 280" fill="#388E3C"/>
  
  <!-- 竹叶 - 左3 -->
  <path d="M 75 400 Q 20 370 10 420 Q 30 410 75 410" fill="#388E3C"/>
</svg>