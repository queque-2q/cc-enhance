<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CC Diff</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--vscode-editor-background, #1e1e1e);
      --fg: var(--vscode-editor-foreground, #d4d4d4);
      --muted: var(--vscode-descriptionForeground, #888);
      --border: var(--vscode-panel-border, #333);
      --accent: var(--vscode-textLink-foreground, #3794ff);
      --green: var(--vscode-terminal-ansiGreen, #23a952);
      --red: var(--vscode-terminal-ansiRed, #e54b4b);
      --btn-bg: var(--vscode-button-background, #0e639c);
      --btn-fg: var(--vscode-button-foreground, #fff);
      --btn-secondary-bg: var(--vscode-button-secondaryBackground, #3a3d41);
      --font: var(--vscode-font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
      --mono: var(--vscode-editor-font-family, 'Cascadia Code', 'Consolas', 'Courier New', monospace);
    }
    html, body {
      height: 100%;
      display: flex;
      flex-direction: column;
      font-family: var(--font);
      font-size: 13px;
      color: var(--fg);
      background: var(--bg);
      overflow: hidden;
    }

    /* ── Toolbar ──────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .toolbar-filename {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-group { display: flex; gap: 4px; }
    .btn {
      font-family: var(--font);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 10px;
      height: 22px;
      border: 1px solid;
      border-radius: 3px;
      cursor: pointer;
      background: transparent;
      white-space: nowrap;
      transition: background 0.12s ease;
    }
    .btn-keep {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--btn-fg);
    }
    .btn-keep:hover,
    .btn-keep.active {
      filter: brightness(0.85);
    }
    .btn-undo {
      background: var(--red);
      border-color: var(--red);
      color: var(--btn-fg);
    }
    .btn-undo:hover,
    .btn-undo.active {
      filter: brightness(0.85);
    }
    .btn-mode {
      color: var(--muted);
      border-color: var(--border);
      font-size: 10px;
    }
    .btn-mode.active {
      color: var(--fg);
      background: var(--btn-secondary-bg);
      border-color: var(--accent);
    }
    .btn-mode:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .btn-nav {
      color: var(--muted);
      border-color: var(--border);
      font-size: 10px;
      padding: 2px 6px;
    }
    .btn-nav:not(:disabled):hover {
      color: var(--fg);
      border-color: var(--accent);
    }
    .btn-nav:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .btn-file {
      color: var(--accent);
      border-color: var(--accent);
      font-size: 11px;
    }
    .btn-file:hover {
      background: var(--accent);
      color: var(--btn-fg);
    }

    /* ── Monaco container ──────────────────── */
    #editor-container {
      flex: 1;
      min-height: 0;
      position: relative;
    }

    /* ── Hunk action overlay layer ──────────── */
    #hunk-actions-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }
    #hunk-actions-layer .hunk-actions {
      position: absolute;
      right: 14px;
      pointer-events: auto;
      display: inline-flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      gap: 4px;
    }

    /* ── Footer ────────────────────────────── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 4px 12px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      font-size: 11px;
      color: var(--muted);
    }

    /* ── Loading / Empty ───────────────────── */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .overlay-text {
      font-size: 14px;
      color: var(--muted);
    }

    /* ── Hunk action buttons ───────────────── */
    #hunk-actions-layer .hunk-actions .btn-hunk {
      font-family: var(--font);
      font-size: 10px;
      font-weight: 600;
      padding: 1px 8px;
      height: 18px;
      line-height: 16px;
      border: 1px solid;
      border-radius: 3px;
      cursor: pointer;
      background: transparent;
      white-space: nowrap;
      transition: background 0.12s ease;
    }
    #hunk-actions-layer .hunk-actions .btn-hunk.btn-keep { background: var(--accent); border-color: var(--accent); color: var(--btn-fg); }
    #hunk-actions-layer .hunk-actions .btn-hunk.btn-keep:hover { filter: brightness(0.85); }
    #hunk-actions-layer .hunk-actions .btn-hunk.btn-undo { background: var(--red); border-color: var(--red); color: var(--btn-fg); }
    #hunk-actions-layer .hunk-actions .btn-hunk.btn-undo:hover { filter: brightness(0.85); }

  </style>
</head>
<body>
  <!-- Toolbar -->
  <div class="toolbar" id="toolbar">
    <span class="toolbar-filename" id="filename">CC Diff</span>
    <span style="font-size:10px;color:var(--muted);margin-left:auto" id="hunk-pos">-</span>
    <div class="btn-group" id="nav-group">
      <button class="btn btn-nav" id="btn-prev-hunk" title="Previous Hunk">◀</button>
      <button class="btn btn-nav" id="btn-next-hunk" title="Next Hunk">▶</button>
    </div>
    <div class="btn-group">
      <button class="btn btn-keep" id="btn-keep-all">Keep All</button>
      <button class="btn btn-undo" id="btn-undo-all">Undo All</button>
    </div>
  </div>

  <!-- Monaco diff editor -->
  <div id="editor-container">
    <div class="overlay" id="loading-overlay">
      <span class="overlay-text" id="loading-text"></span>
    </div>
    <div id="hunk-actions-layer"></div>
  </div>

  <!-- Footer -->
  <div class="footer" id="footer">
    <span id="footer-text"></span>
  </div>

  <script src="__MONACO_LOADER_JS__"></script>
  <script>
    // ==================================================================
    // VSCode API
    // ==================================================================
    var vscode;
    try {
      vscode = acquireVsCodeApi();
    } catch (e) {
      vscode = { postMessage: function(m) { console.log('postMessage:', m); } };
    }

    function t(key, fallback) {
      var i18n = window.__i18n || {};
      return i18n[key] || fallback || key;
    }

    // Set initial i18n text for static elements
    document.getElementById('loading-text').textContent = t('loading', 'Loading diff editor...');

    // Localize the hunk-navigation buttons' tooltips (keep the ◀/▶ glyphs).
    document.getElementById('btn-prev-hunk').title = t('prevHunk', 'Previous Hunk');
    document.getElementById('btn-next-hunk').title = t('nextHunk', 'Next Hunk');

    // ==================================================================
    // State
    // ==================================================================
    var state = {
      file: '',
      changes: [],   // Monaco LineChange[] — the single source of truth
      diffEditor: null,
      originalModel: null,
      modifiedModel: null,
      mode: 'side-by-side',  // 'side-by-side' | 'inline'
      currentHunkIndex: -1,  // 0-based index into changes array, -1 = none
      dirty: false,          // true when modified model differs from disk
      _syncing: false        // true while we programmatically setValue (ignore change events)
    };

    // ==================================================================
    // Monaco bootstrap
    // ==================================================================
    var MONACO_LOADED = false;

    // Configure Monaco Environment for web workers
    self.MonacoEnvironment = {
      getWorkerUrl: function (moduleId, label) {
        if (label === 'json') {
          return '__MONACO_BASE_URI__' + 'vs/language/json/json.worker.js';
        }
        if (label === 'css' || label === 'scss' || label === 'less') {
          return '__MONACO_BASE_URI__' + 'vs/language/css/css.worker.js';
        }
        if (label === 'html' || label === 'handlebars' || label === 'razor') {
          return '__MONACO_BASE_URI__' + 'vs/language/html/html.worker.js';
        }
        if (label === 'typescript' || label === 'javascript') {
          return '__MONACO_BASE_URI__' + 'vs/language/typescript/ts.worker.js';
        }
        return '__MONACO_BASE_URI__' + 'vs/editor/editor.worker.js';
      }
    };

    require.config({
      baseUrl: '__MONACO_BASE_URI__'
    });

    require(['vs/editor/editor.main'], function () {
      MONACO_LOADED = true;
      hideLoading();

      // Set toolbar button text
      document.getElementById('btn-keep-all').textContent = t('keepAll', 'Keep All');
      document.getElementById('btn-undo-all').textContent = t('undoAll', 'Undo All');

      // If renderDiff arrived before Monaco loaded, render now
      if (state._pendingRender) {
        renderDiff(state._pendingRender);
        state._pendingRender = null;
      }
    });

    function hideLoading() {
      var overlay = document.getElementById('loading-overlay');
      if (overlay) overlay.style.display = 'none';
    }

    // ==================================================================
    // Language detection
    // ==================================================================
    function getLanguageFromFilename(filename) {
      if (!filename) return 'plaintext';
      var ext = filename.split('.').pop().toLowerCase();

      // Monaco language ID map for common file extensions
      var extMap = {
        js: 'javascript', mjs: 'javascript', cjs: 'javascript',
        jsx: 'javascript',
        ts: 'typescript', tsx: 'typescript',
        json: 'json', jsonc: 'json',
        html: 'html', htm: 'html',
        css: 'css', scss: 'scss', less: 'less',
        py: 'python', pyw: 'python',
        rs: 'rust',
        go: 'go',
        java: 'java',
        c: 'c', h: 'c',
        cpp: 'cpp', cc: 'cpp', cxx: 'cpp', hpp: 'cpp', hxx: 'cpp',
        cs: 'csharp',
        rb: 'ruby',
        php: 'php',
        swift: 'swift',
        kt: 'kotlin', kts: 'kotlin',
        scala: 'scala',
        md: 'markdown', mdx: 'markdown', markdown: 'markdown',
        yaml: 'yaml', yml: 'yaml',
        xml: 'xml', svg: 'xml',
        sql: 'sql',
        sh: 'shell', bash: 'shell', zsh: 'shell', fish: 'shell',
        ps1: 'powershell', psm1: 'powershell',
        bat: 'bat', cmd: 'bat',
        dockerfile: 'dockerfile',
        toml: 'ini', ini: 'ini', cfg: 'ini',
        lua: 'lua',
        r: 'r',
        pl: 'perl', pm: 'perl',
        dart: 'dart',
        vue: 'html',
        svelte: 'html',
        astro: 'html',
      };

      var lang = extMap[ext];
      if (lang) return lang;

      // Try Monaco's registered languages as fallback
      if (monaco && monaco.languages && monaco.languages.getLanguages) {
        var langs = monaco.languages.getLanguages();
        for (var i = 0; i < langs.length; i++) {
          if (langs[i].extensions) {
            for (var j = 0; j < langs[i].extensions.length; j++) {
              if (langs[i].extensions[j] === '.' + ext) {
                return langs[i].id;
              }
            }
          }
        }
      }

      return 'plaintext';
    }

    // ==================================================================
    // Theme detection
    // ==================================================================
    function detectMonacoTheme() {
      var bodyClass = document.body.className || '';
      if (bodyClass.indexOf('vscode-high-contrast') !== -1) return 'hc-black';
      if (bodyClass.indexOf('vscode-dark') !== -1) return 'vs-dark';
      return 'vs';
    }

    function syncTheme() {
      if (!state.diffEditor) return;
      var theme = detectMonacoTheme();
      monaco.editor.setTheme(theme);
    }

    // ==================================================================
    // Render diff
    // ==================================================================
    function renderDiff(data) {
      // If Monaco not loaded yet, defer
      if (!MONACO_LOADED) {
        state._pendingRender = data;
        return;
      }

      // New file → allow re-positioning the cursor to the first hunk.
      if (state.file !== data.file) {
        state._initialCursorSet = false;
      }
      state.file = data.file;

      var container = document.getElementById('editor-container');

      // Update UI
      document.getElementById('filename').textContent = 'CC Diff: ' + (data.file || '');

      var original = data.original || '';
      var modified = data.modified || '';
      var language = getLanguageFromFilename(data.file);

      // Dispose old overlay widgets
      clearHunkButtons();

      if (state.diffEditor) {
        // Update existing models (also update language in case file changed).
        // setValue() fires change events — suppress dirty marking while syncing.
        state._syncing = true;
        state.originalModel.setValue(original);
        state.modifiedModel.setValue(modified);
        state._syncing = false;
        if (state.originalModel.getLanguageId() !== language) {
          monaco.editor.setModelLanguage(state.originalModel, language);
        }
        if (state.modifiedModel.getLanguageId() !== language) {
          monaco.editor.setModelLanguage(state.modifiedModel, language);
        }
      } else {
        // First render: create models + diff editor
        state.originalModel = monaco.editor.createModel(original, language);
        state.modifiedModel = monaco.editor.createModel(modified, language);

        // Track unsaved edits: mark dirty on user changes, ignore our own syncs
        state.modifiedModel.onDidChangeContent(function () {
          if (state._syncing) return;
          setDirty(true);
        });

        state.diffEditor = monaco.editor.createDiffEditor(container, {
          enableSplitViewResizing: true,
          renderSideBySide: state.mode === 'side-by-side',
          useInlineViewWhenSpaceIsLimited: false,
          readOnly: true,
          minimap: { enabled: false },
          scrollBeyondLastLine: false,
          glyphMargin: false,
          lineNumbers: 'on',
          renderIndicators: false,
          originalEditable: false,
          automaticLayout: true,
          ignoreTrimWhitespace: false,
          // 'legacy' (standard Myers) is closer to `git diff` than the default
          // 'smart' heuristic, reducing hunk-boundary divergence.
          diffAlgorithm: 'legacy',
        });

        // Responsive mode: force inline when container is too narrow
        setupResponsiveMode(container);

        state.diffEditor.setModel({
          original: state.originalModel,
          modified: state.modifiedModel,
        });

        // The diff is computed asynchronously in a Monaco worker, so
        // getLineChanges() is not available immediately after setModel. Rebuild
        // the hunk UI once Monaco finishes computing the diff (and on every
        // subsequent recompute, e.g. after the user edits the modified model).
        state.diffEditor.onDidUpdateDiff(function () {
          rebuildHunks();
        });

        syncTheme();

        // Enable visible cursor on modified editor (readOnly hides it by default)
        var modEdit = state.diffEditor.getModifiedEditor();
        modEdit.updateOptions({ readOnly: false, cursorBlinking: 'blink', cursorStyle: 'line' });

        // Listen to scroll and cursor changes on modified editor to update nav buttons
        modEdit.onDidScrollChange(function () {
          updateNavButtons();
          syncOverlayPositions();
        });
        modEdit.onDidChangeCursorPosition(function () {
          updateNavButtons();
        });
        // Update overlay positions when layout changes (resize, mode toggle, etc.)
        modEdit.onDidLayoutChange(function () {
          syncOverlayPositions();
        });
      }
      if (state.diffEditor) {
        state.diffEditor.updateOptions({
          renderSideBySide: !forcedInline && state.mode === 'side-by-side'
        });
      }

      // Model is now synced to disk content — clear any dirty marker
      setDirty(false);

      // Rebuild hunk overlay + nav. For the async diff this also runs when
      // onDidUpdateDiff fires; rebuildHunks is idempotent and re-positions the
      // cursor to the first hunk exactly once per file.
      rebuildHunks();

      // Initial position sync (after Monaco has laid out)
      requestAnimationFrame(function () {
        syncOverlayPositions();
      });
    }

    function updateDiff(data) {
      // Same flow as renderDiff but without re-creating editor
      renderDiff(data);
    }

    // ==================================================================
    // Hunk action overlay widgets
    // ==================================================================

    /** Track overlay widget DOM nodes for position syncing */
    var hunkOverlayRefs = []; // { el, lineNumber }

    /**
     * Get the current diff changes from Monaco (the exact hunks it displays).
     * Each change is normalized and given an `id` (array index).
     */
    function getChanges() {
      if (!state.diffEditor) return [];
      var raw = state.diffEditor.getLineChanges();
      if (!raw || !raw.length) return [];
      return raw.map(function (c, i) {
        // Monaco reports an empty side (pure insert/delete) as [insertIdx, 0]
        // where insertIdx is 0-based. Normalize to the 1-based inclusive
        // convention [insertIdx+1, insertIdx] used everywhere in this file, so
        // keep/undo and anchors treat add-only and delete-only hunks uniformly.
        var oStart = c.originalStartLineNumber;
        var oEnd = c.originalEndLineNumber;
        if (oEnd === 0) { oStart = oStart + 1; oEnd = oStart - 1; }
        var mStart = c.modifiedStartLineNumber;
        var mEnd = c.modifiedEndLineNumber;
        if (mEnd === 0) { mStart = mStart + 1; mEnd = mStart - 1; }
        return {
          id: i,
          originalStartLineNumber: oStart,
          originalEndLineNumber: oEnd,
          modifiedStartLineNumber: mStart,
          modifiedEndLineNumber: mEnd
        };
      });
    }

    /**
     * Recompute changes from Monaco and rebuild the hunk overlay + nav + footer
     * UI. Idempotent. Runs after each render AND when Monaco finishes computing
     * the diff asynchronously (onDidUpdateDiff), so the count/positions stay
     * correct even though getLineChanges() is not ready synchronously.
     */
    function rebuildHunks() {
      if (!state.diffEditor) return;
      state.changes = getChanges();
      clearHunkButtons();
      for (var i = 0; i < state.changes.length; i++) {
        addHunkButtons(state.changes[i]);
      }
      updateToolbar(state.changes.length);
      syncOverlayPositions();
      document.getElementById('footer-text').textContent =
        state.changes.length + ' ' + t('hunksRemaining', 'hunk(s) remaining');
      // Set cursor to first hunk start line once (avoid default 1,1 position).
      if (state.changes.length > 0 && !state._initialCursorSet) {
        state._initialCursorSet = true;
        var firstLine = changeAnchorLine(state.changes[0]);
        state.diffEditor.getModifiedEditor().setSelection({
          startLineNumber: firstLine,
          startColumn: 1,
          endLineNumber: firstLine,
          endColumn: 1
        });
      }
    }

    /** Map a change to the modified-side line its buttons/nav should anchor on. */
    function changeAnchorLine(change) {
      var modCount = state.modifiedModel ? state.modifiedModel.getLineCount() : 0;
      var mStart = change.modifiedStartLineNumber;
      var mEnd = change.modifiedEndLineNumber;
      if (mStart <= mEnd && mStart >= 1) {
        return Math.min(mStart, modCount);
      }
      // Pure deletion: anchor at the deletion position, clamped to a real line.
      return Math.max(1, Math.min(mStart, modCount));
    }

    /** Roughly map a modified line number to an original line number. */
    function mapModifiedToOriginal(modLine, change) {
      var oStart = change.originalStartLineNumber;
      var mStart = change.modifiedStartLineNumber;
      return oStart + (modLine - mStart);
    }

    /** Get the layer div, creating it if needed */
    function getHunkLayer() {
      return document.getElementById('hunk-actions-layer');
    }

    /** Create DOM buttons for a single hunk and add them to the overlay layer */
    function addHunkButtons(change) {
      var lineNumber = changeAnchorLine(change);
      if (lineNumber < 0) return;

      var layer = getHunkLayer();
      if (!layer) return;

      var el = document.createElement('div');
      el.className = 'hunk-actions';
      el.setAttribute('data-hunk-id', change.id);
      el.setAttribute('data-line', lineNumber);

      var payload = {
        originalStartLineNumber: change.originalStartLineNumber,
        originalEndLineNumber: change.originalEndLineNumber,
        modifiedStartLineNumber: change.modifiedStartLineNumber,
        modifiedEndLineNumber: change.modifiedEndLineNumber
      };

      var keepBtn = document.createElement('button');
      keepBtn.className = 'btn-hunk btn-keep';
      keepBtn.textContent = t('keep', 'Keep');
      keepBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        vscode.postMessage({ command: 'keepHunk', hunkId: change.id, change: payload });
      });

      var undoBtn = document.createElement('button');
      undoBtn.className = 'btn-hunk btn-undo';
      undoBtn.textContent = t('undo', 'Undo');
      undoBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        vscode.postMessage({ command: 'undoHunk', hunkId: change.id, change: payload });
      });

      el.appendChild(keepBtn);
      el.appendChild(undoBtn);
      layer.appendChild(el);

      hunkOverlayRefs.push({ el: el, lineNumber: lineNumber });
    }

    /**
     * Sync all hunk button positions with the editor's current scroll/layout state.
     * Called on scroll, layout change, and after initial render.
     */
    function syncOverlayPositions() {
      if (!state.diffEditor) return;

      var editor = state.diffEditor.getModifiedEditor();
      var layer = getHunkLayer();
      if (!layer || hunkOverlayRefs.length === 0) return;

      // Get modified editor's position relative to the container
      var containerRect = document.getElementById('editor-container').getBoundingClientRect();
      var editorDomNode = editor.getDomNode();
      if (!editorDomNode) return;
      var editorRect = editorDomNode.getBoundingClientRect();

      var editorOffsetTop = editorRect.top - containerRect.top;
      var scrollTop = editor.getScrollTop();
      var layoutInfo = editor.getLayoutInfo();
      // Right edge of the text content area relative to layer
      var textRight = editorRect.left - containerRect.left + layoutInfo.contentLeft + layoutInfo.contentWidth;

      for (var i = 0; i < hunkOverlayRefs.length; i++) {
        var ref = hunkOverlayRefs[i];
        var lineTop = editor.getTopForLineNumber(ref.lineNumber);
        // Viewport-relative top: document position minus scroll, plus editor offset
        var top = editorOffsetTop + lineTop - scrollTop;

        ref.el.style.top = top + 'px';
        ref.el.style.right = (containerRect.width - textRight + 14) + 'px';
      }
    }

    /** Remove all hunk buttons from the overlay layer */
    function clearHunkButtons() {
      var layer = getHunkLayer();
      if (layer) {
        layer.innerHTML = '';
      }
      hunkOverlayRefs = [];
    }

    /**
     * Update the dirty (unsaved-edit) state and notify the extension,
     * which reflects it in the panel title. No-op if unchanged.
     */
    function setDirty(dirty) {
      if (state.dirty === dirty) return;
      state.dirty = dirty;
      vscode.postMessage({ command: 'dirtyChange', dirty: dirty });
    }

    // ==================================================================
    // Hunk navigation
    // ==================================================================
    function findCurrentHunkIndex() {
      if (!state.diffEditor || state.changes.length === 0) return -1;
      var editor = state.diffEditor.getModifiedEditor();
      var selection = editor.getSelection();
      if (!selection) return -1;
      var cursorLine = selection.startLineNumber;
      var modCount = state.modifiedModel ? state.modifiedModel.getLineCount() : 0;
      for (var i = 0; i < state.changes.length; i++) {
        var c = state.changes[i];
        if (c.modifiedStartLineNumber <= c.modifiedEndLineNumber) {
          if (cursorLine >= c.modifiedStartLineNumber && cursorLine <= c.modifiedEndLineNumber) {
            return i;
          }
        } else {
          var anchor = Math.max(1, Math.min(c.modifiedStartLineNumber, modCount));
          if (cursorLine === anchor) return i;
        }
      }
      return -1;
    }

    function navigateHunk(direction) {
      if (!state.diffEditor || state.changes.length === 0) return;

      var curIdx = findCurrentHunkIndex();
      var target = -1;

      var editor = state.diffEditor.getModifiedEditor();
      var selection = editor.getSelection();
      var cursorLine = selection ? selection.startLineNumber : 1;

      if (curIdx >= 0) {
        target = direction === 'next' ? curIdx + 1 : curIdx - 1;
      } else if (direction === 'next') {
        for (var i = 0; i < state.changes.length; i++) {
          var s = changeAnchorLine(state.changes[i]);
          if (s > cursorLine) { target = i; break; }
        }
      } else {
        for (var i = state.changes.length - 1; i >= 0; i--) {
          var s2 = changeAnchorLine(state.changes[i]);
          if (s2 < cursorLine) { target = i; break; }
        }
      }

      if (target < 0 || target >= state.changes.length) return;
      state.currentHunkIndex = target;
      scrollToHunk(target);
    }

    function scrollToHunk(index) {
      if (!state.diffEditor || index < 0 || index >= state.changes.length) return;

      var change = state.changes[index];
      var modEditor = state.diffEditor.getModifiedEditor();
      var origEditor = state.diffEditor.getOriginalEditor();
      var targetLine = changeAnchorLine(change);

      modEditor.setSelection({
        startLineNumber: targetLine,
        startColumn: 1,
        endLineNumber: targetLine,
        endColumn: 1
      });
      modEditor.focus();

      var visible = modEditor.getVisibleRanges();
      var isVisible = false;
      for (var v = 0; v < visible.length; v++) {
        if (targetLine >= visible[v].startLineNumber && targetLine <= visible[v].endLineNumber) {
          isVisible = true;
          break;
        }
      }
      if (isVisible) {
        vscode.postMessage({
          command: 'log',
          text: 'Hunk ' + (index + 1) + '/' + state.changes.length
            + ' line ' + targetLine + ' already visible — no scroll'
        });
        return;
      }

      var lineTop = modEditor.getTopForLineNumber(targetLine);
      var viewHeight = modEditor.getLayoutInfo().height;
      modEditor.setScrollTop(Math.max(0, lineTop - viewHeight * 0.25));

      var origLine = mapModifiedToOriginal(targetLine, change);
      if (origLine > 0) {
        try {
          var origLineTop = origEditor.getTopForLineNumber(origLine);
          origEditor.setScrollTop(Math.max(0, origLineTop - viewHeight * 0.25));
        } catch (e) { /* best-effort */ }
      }

      vscode.postMessage({
        command: 'log',
        text: 'Nav to hunk ' + (index + 1) + '/' + state.changes.length
          + ' line ' + targetLine + ' (scrollTop=' + Math.round(lineTop) + ')'
      });
    }

    function updateNavButtons() {
      var prevBtn = document.getElementById('btn-prev-hunk');
      var nextBtn = document.getElementById('btn-next-hunk');
      var posSpan = document.getElementById('hunk-pos');

      if (state.changes.length === 0) {
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        posSpan.textContent = '-';
        return;
      }

      var editor = state.diffEditor ? state.diffEditor.getModifiedEditor() : null;
      var selection = editor ? editor.getSelection() : null;
      var cursorLine = selection ? selection.startLineNumber : 1;

      var curIdx = findCurrentHunkIndex();
      if (curIdx >= 0) {
        state.currentHunkIndex = curIdx;
        prevBtn.disabled = curIdx <= 0;
        nextBtn.disabled = curIdx >= state.changes.length - 1;
        posSpan.textContent = (curIdx + 1) + ' / ' + state.changes.length;
        return;
      }

      var firstStart = Infinity;
      var lastEnd = -Infinity;
      for (var i = 0; i < state.changes.length; i++) {
        var a = changeAnchorLine(state.changes[i]);
        if (i === 0) firstStart = a;
        lastEnd = a;
      }

      prevBtn.disabled = cursorLine <= firstStart;
      nextBtn.disabled = cursorLine >= lastEnd;
      var shown = (state.currentHunkIndex >= 0) ? (state.currentHunkIndex + 1) : '?';
      posSpan.textContent = shown + ' / ' + state.changes.length;
    }

    // ==================================================================
    // Open current file
    // ==================================================================
    function openCurrentFile() {
      if (!state.diffEditor || !state.file) return;

      var editor = state.diffEditor.getModifiedEditor();
      // Use cursor position for consistency with hunk navigation
      var selection = editor.getSelection();
      var line = selection ? selection.startLineNumber : 1;

      vscode.postMessage({
        command: 'openCurrentFile',
        file: state.file,
        line: line
      });
    }

    // ==================================================================
    // UI helpers
    // ==================================================================
    function updateToolbar(hunkCount) {
      updateNavButtons();
    }

    // Minimum width (px) required for side-by-side to be usable
    var SIDE_BY_SIDE_MIN_WIDTH = 700;
    var forcedInline = false; // true when container is too narrow for side-by-side

    function setupResponsiveMode(container) {
      var ro = new ResizeObserver(function (entries) {
        var width = entries[0] && entries[0].contentRect ? entries[0].contentRect.width : 0;
        var wasForced = forcedInline;

        if (width > 0 && width < SIDE_BY_SIDE_MIN_WIDTH) {
          forcedInline = true;
          if (state.diffEditor) {
            state.diffEditor.updateOptions({ renderSideBySide: false });
          }
        } else if (wasForced && width >= SIDE_BY_SIDE_MIN_WIDTH) {
          forcedInline = false;
          if (state.diffEditor) {
            state.diffEditor.updateOptions({
              renderSideBySide: state.mode === 'side-by-side'
            });
          }
        }
      });
      ro.observe(container);
    }

    function setMode(mode) {
      state.mode = mode;
      if (state.diffEditor) {
        // Only apply side-by-side if not forced inline by narrow width
        if (mode === 'side-by-side' && forcedInline) {
          // Silently keep inline — too narrow
          return;
        }
        state.diffEditor.updateOptions({
          renderSideBySide: mode === 'side-by-side'
        });
      }

      vscode.postMessage({ command: 'switchMode', mode: mode });
    }

    // ==================================================================
    // Toolbar events
    // ==================================================================
    document.getElementById('btn-prev-hunk').addEventListener('click', function () {
      navigateHunk('prev');
    });
    document.getElementById('btn-next-hunk').addEventListener('click', function () {
      navigateHunk('next');
    });
    document.getElementById('btn-keep-all').addEventListener('click', function () {
      vscode.postMessage({ command: 'keepAll' });
    });
    document.getElementById('btn-undo-all').addEventListener('click', function () {
      vscode.postMessage({ command: 'undoAll' });
    });

    // ==================================================================
    // Message handler
    // ==================================================================
    window.addEventListener('message', function (e) {
      var msg = e.data;
      switch (msg.command) {
        case 'renderDiff':
          renderDiff(msg);
          break;
        case 'diffUpdated':
          updateDiff(msg);
          break;
        case 'allProcessed':
          document.getElementById('footer-text').textContent = t('allProcessed', 'All changes processed.');
          document.getElementById('hunk-pos').textContent = '-';
          clearHunkButtons();
          break;
        case 'navigateHunk':
          navigateHunk(msg.direction);
          break;
        case 'toggleMode':
          setMode(state.mode === 'side-by-side' ? 'inline' : 'side-by-side');
          break;
        case 'openCurrentFile':
          openCurrentFile();
          break;
        case 'triggerSave':
          // Extension asked us to save (Ctrl+S / File>Save while this panel is focused).
          // Only save if there is a modified model to persist.
          if (state.modifiedModel) {
            // getValue() with no arg (TextDefined) keeps the model's own line
            // ending (LF vs CRLF), so no EOL conversion is needed here.
            vscode.postMessage({
              command: 'saveFile',
              content: state.modifiedModel.getValue()
            });
          }
          break;
      }
    });

    // ==================================================================
    // Theme sync via MutationObserver
    // ==================================================================
    var themeObserver = new MutationObserver(function () {
      syncTheme();
    });
    themeObserver.observe(document.body, {
      attributes: true,
      attributeFilter: ['class']
    });

    // ==================================================================
    // Init
    // ==================================================================
    vscode.postMessage({ command: 'ready' });
  </script>
</body>
</html>
